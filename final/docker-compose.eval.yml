# Isolated evaluation services. Never shares production volumes or ports.
name: agisaber-eval
services:
  postgres:
    image: postgres:16-alpine
    mem_limit: 256m
    environment:
      POSTGRES_USER: eval
      POSTGRES_PASSWORD: eval-local-only
      POSTGRES_DB: agisaber_eval
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["pg16:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eval -d agisaber_eval"]
      interval: 5s
      timeout: 5s
      retries: 30
  elasticsearch:
    image: elasticsearch:8.17.0
    mem_limit: 768m
    # Recreate the disposable keystore: this host's cached image has an empty one.
    entrypoint: ["/bin/tini", "--", "/bin/bash", "-c", "echo y | /usr/share/elasticsearch/bin/elasticsearch-keystore create && exec /usr/local/bin/docker-entrypoint.sh eswrapper"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms256m -Xmx256m
    ports: ["127.0.0.1:19200:9200"]
    volumes: ["es:/usr/share/elasticsearch/data"]
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    mem_limit: 128m
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes: ["etcd:/etcd"]
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    mem_limit: 256m
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /data
    volumes: ["minio:/data"]
  milvus:
    image: milvusdb/milvus:v2.4.17
    mem_limit: 1536m
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports: ["127.0.0.1:19540:19530", "127.0.0.1:19091:9091"]
    volumes: ["milvus:/var/lib/milvus"]
    depends_on: [etcd, minio]
  neo4j:
    image: neo4j:5.18-community
    mem_limit: 768m
    # Start from a reviewed config instead of the corrupted cached image config.
    entrypoint: ["tini", "-g", "--", "/bin/bash", "-c", "cp /eval-config/neo4j.conf /var/lib/neo4j/conf/neo4j.conf && exec /startup/docker-entrypoint.sh neo4j"]
    environment:
      NEO4J_AUTH: neo4j/eval-local-only
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 128m
    ports: ["127.0.0.1:17474:7474", "127.0.0.1:17687:7687"]
    volumes: ["neo4j:/data", "./config/neo4j.eval.conf:/eval-config/neo4j.conf:ro"]
volumes:
  pg16:
  es:
  etcd:
  minio:
  milvus:
  neo4j:
