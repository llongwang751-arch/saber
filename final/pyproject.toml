# Ruff 门禁：只盯正确性问题（语法错误、未定义名、未使用导入等），
# 不做风格强约束——风格留给团队后续决定。CI 中与 pytest 同跑。
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", ".venv313", ".venvclean", "web", "frontend", "alembic"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# 测试里常见的占位参数/局部变量
"tests/*" = ["F841"]
# 包 __init__ 的模块重导出是既有模式
"**/__init__.py" = ["F401"]
