# 对话模型配置
llm:
  api_url: https://ark.cn-beijing.volces.com/api/v3/chat/completions
  api_key: ""
  model: deepseek-v4-flash-260425
  fast_model: ""  # 留空时回退主模型
  temperature: 0.7

embedding:
  api_url: https://ark.cn-beijing.volces.com/api/v3/embeddings/multimodal
  api_key: ""
  model: doubao-embedding-vision-250615
  failure_threshold: 3
  cooldown_seconds: 30
  half_open_max_calls: 1

# 向量数据库配置
milvus:
  host: localhost
  port: 19530

# 关系型数据库配置
postgres:
  host: localhost
  port: 5432
  user: aiagent
  password: ${AGI_PG_PASSWORD}  # 通过 .env 注入，与 docker-compose 的 Postgres 容器口令保持一致
  database: aiagent

elasticsearch:
  addresses:
    - http://localhost:9200
  username: elastic
  password: changeme

kafka:
  brokers:
    - localhost:29092
  topic: agent-events

# rag 策略
rag:
  chunk_size: 200
  chunk_overlap: 50
  top_k: 3
  rrf_constant_k: 60
  # Go 845e8f7 兼容字段；当前 RRF 中 Milvus/ES 均使用 1.0 权重。
  semantic_weight: 0.7
  enable_hybrid_search: true
  rag_milvus_dim: 2048
  # 只对成功 Rerank 后的 0~1 相关性分数生效；RRF 分数不具备同一语义。
  no_answer_threshold: 0.30
  # 父块字符 3-gram/编辑相似度近重复阈值；这是词法近似，不冒充语义模型分数。
  parent_dedup_threshold: 0.85
  rewrite:
    enabled: true
    num_queries: 3
  rerank:
    enabled: true
    preview_len: 200
    # 连续失败 3 次后打开熔断器；冷却 30 秒后只放 1 个半开探测请求。
    failure_threshold: 3
    cooldown_seconds: 30
    half_open_max_calls: 1
    # local_overlap 是零依赖确定性备用精排，不等同于 Cross-Encoder。
    fallback_mode: local_overlap
    # 切换 fallback_mode=cross_encoder 后填写本地路径或 HuggingFace 模型名。
    cross_encoder_model: ""
  retrieval_circuit:
    failure_threshold: 3
    cooldown_seconds: 30
    half_open_max_calls: 1

memory:
  short_term_max_turns: 5
  long_term_top_k: 3
  consolidation:
    similarity_threshold: 0.80   # 合并阈值：超过此相似度的记忆会被合并
    dedup_threshold: 0.95        # 去重阈值：超过此相似度的记忆视为重复
    ttl_days: 30                 # 过期天数：超过此天数的低重要性记忆会被淘汰
    decay_rate: 0.995            # 每日衰减系数（0.995 = 每天保留 99.5%）
    min_importance: 0.3          # 低于此重要性 + 超 TTL 的记忆会被淘汰
    trigger_interval: 5          # 每存入 N 条新记忆后触发合并

harness:
  max_retries: 3
  retry_delay_ms: 200
  step_timeout_ms: 5000
  max_iterations: 5

graph_runtime:
  max_parallel: 2
  race_timeout_ms: 30000
  enable_racing: true
  replan_enabled: true
  max_replan: 2
  replan_on_failed: true

server:
  port: "8090"

search:
  api_key: ""               # 请填入你的 Tavily API Key（可选）
  api_url: "https://api.tavily.com/search"

# ===== 知识图谱（Neo4j，可选，不可用时跳过图检索）=====
neo4j:
  uri: "bolt://localhost:7687"
  user: "neo4j"
  password: "${AGI_NEO4J_PASSWORD}"  # 通过 .env 注入，与 docker-compose 的 Neo4j 容器口令保持一致
  max_hops: 2        # 图遍历最大跳数
  weight: 0.3        # 图检索在 RRF 融合中的权重
  enabled: true      # false 时完全跳过知识图谱

# ===== 沙箱执行（用于终端命令工具）=====
sandbox:
  enabled: true
  backend: "docker"     # "docker" | "local" | "mock"
  image: "ubuntu:22.04"
  timeout_ms: 30000
  max_output_bytes: 65536
  memory_limit_mb: 256
  cpu_percent: 50
  max_pids: 64
  network_disabled: true
  readonly_rootfs: true
  artifact_host_dir: "~/Desktop/agi-saber"

# ===== 命令安全校验 =====
security:
  max_command_length: 500
  allowlist_mode: false  # true = 白名单模式，只允许明确列出的命令
  allowlist:
    - "ls"
    - "cat"
    - "echo"
    - "pwd"
    - "date"
    - "python3"
    - "node"
    - "go"
    - "java"

auth:
  jwt_secret: "${JWT_SECRET}"
  jwt_ttl_hours: 168
  jwt_issuer: "agi-assistant"

observability:
  trace_retention_days: 30
  pprof:
    enabled: false
    admin_token: "${PPROF_ADMIN_TOKEN}"

skillhub:
  enabled: true
  github_token: "${GITHUB_TOKEN}"
  keyword: "office assistant"
  cache_ttl_min: 30
